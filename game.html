<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Room</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Ransom Notes</h1>
  <h2><span id="roomDisplay"></span></h2>

  <div id="roundResults"></div>

  <div id="2button">
    <button id="promptButton">
        Start New Round
    </button>

    <button id="refreshPrompt">
            Get New Prompt
        </button>
  </div>

  <div></div>

  <div id="promptBox">
    Press the button to generate a prompt.
  </div>

  <div id="answerArea">
    Drop magnets here
  </div>
  <button id="submitAnswer">Submit Answer</button>
  <button id="editAnswerButton">Edit Answer</button>

  <h2>Word Bank</h2>

  <div id="wordBank">

  </div>

  <button id="exitRoomButton">
            Exit Room
        </button>

  <script type="module" src="script.js"></script>
</body>

</html>
